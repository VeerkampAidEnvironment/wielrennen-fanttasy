{% extends "base.html" %}
{% block title %}Inloggen{% endblock %}
{% block body %}
<section class="auth-shell">
  <form class="auth-panel" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Inloggen</h1>
    <label>
      Gebruikersnaam
      <input name="username" autocomplete="username" value="{{ username or '' }}" required>
    </label>
    <label>
      Wachtwoord
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary-button">Inloggen</button>
    <p class="muted">Nieuw hier? <a href="{{ url_for('auth.register') }}">Maak een account aan</a>.</p>
  </form>
</section>
{% endblock %}
