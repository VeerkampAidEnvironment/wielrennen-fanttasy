{% extends "base.html" %}
{% block title %}Registreren{% endblock %}
{% block body %}
<section class="auth-shell">
  <form class="auth-panel" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Registreren</h1>
    <label>
      Gebruikersnaam
      <input name="username" autocomplete="username" value="{{ username or '' }}" required>
    </label>
    <label>
      E-mail
      <input type="email" name="email" autocomplete="email" value="{{ email or '' }}">
    </label>
    <label>
      Wachtwoord
      <input type="password" name="password" autocomplete="new-password" required>
    </label>
    <label>
      Bevestig wachtwoord
      <input type="password" name="confirm" autocomplete="new-password" required>
    </label>
    <button type="submit" class="primary-button">Account aanmaken</button>
    <p class="muted">Al geregistreerd? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
  </form>
</section>
{% endblock %}
